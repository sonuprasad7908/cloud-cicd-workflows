name: Reusable Deployment Validation

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

      image_tag:
        description: Docker image tag
        required: true
        type: string

      source_ref:
        description: Git revision to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: ${{ inputs.environment }}

    env:
      IMAGE_NAME: cloud-cicd-demo
      CONTAINER_NAME: cloud-cicd-demo-${{ inputs.environment }}

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Build deployment image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ inputs.image_tag }}" \
            ./sample-app

      - name: Start application container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 3000:3000 \
            -e APP_VERSION="${{ inputs.image_tag }}" \
            "${IMAGE_NAME}:${{ inputs.image_tag }}"

      - name: Validate health-check script
        run: bash -n ./scripts/health-check.sh

      - name: Wait for application health
        run: |
          ./scripts/health-check.sh \
            http://127.0.0.1:3000/health \
            '"status":"healthy"' \
            12 \
            5

      - name: Validate application endpoint
        run: |
          ./scripts/health-check.sh \
            http://127.0.0.1:3000/ \
            '"message":"Cloud CI/CD Demo"' \
            3 \
            2

      - name: Verify non-root execution
        run: |
          USER_ID="$(docker exec "${CONTAINER_NAME}" id -u)"

          echo "Container UID: ${USER_ID}"

          if [ "${USER_ID}" = "0" ]; then
            echo "Deployment container is running as root."
            exit 1
          fi

      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker logs "${CONTAINER_NAME}" || true

      - name: Clean up deployment
        if: always()
        run: |
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
