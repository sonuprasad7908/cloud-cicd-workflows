name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: sample-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run automated tests
        run: npm test

  docker-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    env:
      IMAGE_NAME: cloud-cicd-demo
      CONTAINER_NAME: cloud-cicd-demo-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./sample-app

      - name: Start test container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 3000:3000 \
            -e APP_VERSION="${GITHUB_SHA}" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Wait for container health
        run: |
          for attempt in {1..12}; do
            STATUS="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "${CONTAINER_NAME}")"

            echo "Health status: ${STATUS}"

            if [ "${STATUS}" = "healthy" ]; then
              exit 0
            fi

            if [ "${STATUS}" = "unhealthy" ]; then
              echo "Container became unhealthy."
              docker logs "${CONTAINER_NAME}"
              exit 1
            fi

            sleep 5
          done

          echo "Container did not become healthy in time."
          docker logs "${CONTAINER_NAME}"
          exit 1

      - name: Validate health endpoint
        run: |
          RESPONSE="$(curl --fail --silent --show-error \
            http://127.0.0.1:3000/health)"

          echo "${RESPONSE}"

          echo "${RESPONSE}" | grep -q '"status":"healthy"'

      - name: Verify non-root execution
        run: |
          USER_ID="$(docker exec "${CONTAINER_NAME}" id -u)"

          echo "Container UID: ${USER_ID}"

          if [ "${USER_ID}" = "0" ]; then
            echo "Container is running as root."
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
